<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>archsys-solvers</title>
  <meta name="description" content="High-Performance Architecture-Aware Numerical Solvers in C++17">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    :root {
      --bg-light: #ffffff;
      --bg-dark: #0a0a0a;
      --text-light: #0a0a0a;
      --text-dark: #ededed;
      --muted-light: #6b7280;
      --muted-dark: #9ca3af;
      --border-light: #e5e7eb;
      --border-dark: #262626;
      --shadow-light: rgba(10, 10, 10, 0.14);
      --shadow-dark: rgba(0, 0, 0, 0.55);

      --bg: var(--bg-light);
      --text: var(--text-light);
      --muted: var(--muted-light);
      --border: var(--border-light);
      --shadow: var(--shadow-light);

      /* Physics-based spring easing curve via CSS linear() */
      --spring-easing: linear(
        0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%,
        1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%,
        1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%,
        0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1.004 83.8%, 1
      );

      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --text: var(--text-dark);
        --muted: var(--muted-dark);
        --border: var(--border-dark);
        --shadow: var(--shadow-dark);
      }
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --text: light-dark(var(--text-light), var(--text-dark));
        --muted: light-dark(var(--muted-light), var(--muted-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --shadow: light-dark(var(--shadow-light), var(--shadow-dark));
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.15rem;
      max-width: 540px;
      width: 100%;
    }

    /* Logo Stage: static, crisp mathematical unit-circle frame around the large 3D knot */
    .logo-stage {
      position: relative;
      width: clamp(310px, 56vw, 400px);
      height: clamp(310px, 56vw, 400px);
      display: grid;
      place-items: center;
      perspective: 900px;
    }

    .math-circle {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      color: var(--text);
      pointer-events: none;
      overflow: visible;
    }

    .math-label-major {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      fill: currentColor;
      fill-opacity: 0.82;
      user-select: none;
    }

    .math-label-minor {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 400;
      fill: currentColor;
      fill-opacity: 0.50;
      user-select: none;
    }

    .logo-tilt {
      --rx: 0deg;
      --ry: 0deg;
      display: grid;
      place-items: center;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
    }

    .logo-link {
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      outline-offset: 8px;
    }

    .logo {
      width: clamp(190px, 34vw, 240px);
      height: clamp(190px, 34vw, 240px);
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .logo-shadow {
      position: absolute;
      bottom: 19%;
      width: 32%;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(closest-side, var(--shadow), transparent 72%);
      pointer-events: none;
      opacity: 0.55;
    }

    h1 {
      font-size: clamp(1.9rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .tagline {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.55;
      max-width: 42ch;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.4rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.86rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    /* Clean static emerald point before Building... */
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      flex-shrink: 0;
    }

    .github-link {
      margin-top: 0.55rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .github-link:hover,
    .github-link:focus-visible {
      color: var(--text);
      border-color: var(--text);
    }

    /* Tactile hover interaction only when user has no reduced-motion preference */
    @media (prefers-reduced-motion: no-preference) {
      .logo-tilt {
        transition: transform 0.25s ease-out;
        will-change: transform;
      }

      .logo-link {
        transition: scale 0.65s ease-out;
        transition-timing-function: var(--spring-easing);
      }

      .logo-link:hover,
      .logo-link:focus-visible {
        scale: 1.06;
      }

      .logo-link:active {
        scale: 0.97;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo-stage" id="logoStage">
      <svg class="math-circle" viewBox="0 0 440 440" aria-hidden="true">
        <!-- Primary unit-circle polar coordinate frame -->
        <g>
          <circle cx="220" cy="220" r="166" fill="none" stroke="currentColor" stroke-width="1.25" stroke-opacity="0.46"/>
          <line x1="368.00" y1="220.00" x2="394.00" y2="220.00" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.80"/>
          <line x1="376.48" y1="178.07" x2="383.24" y2="176.26" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="360.30" y1="139.00" x2="366.36" y2="135.50" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="331.72" y1="108.28" x2="341.62" y2="98.38" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.58"/>
          <line x1="301.00" y1="79.70" x2="304.50" y2="73.64" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="261.93" y1="63.52" x2="263.74" y2="56.76" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="220.00" y1="72.00" x2="220.00" y2="46.00" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.80"/>
          <line x1="178.07" y1="63.52" x2="176.26" y2="56.76" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="139.00" y1="79.70" x2="135.50" y2="73.64" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="108.28" y1="108.28" x2="98.38" y2="98.38" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.58"/>
          <line x1="79.70" y1="139.00" x2="73.64" y2="135.50" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="63.52" y1="178.07" x2="56.76" y2="176.26" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="72.00" y1="220.00" x2="46.00" y2="220.00" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.80"/>
          <line x1="63.52" y1="261.93" x2="56.76" y2="263.74" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="79.70" y1="301.00" x2="73.64" y2="304.50" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="108.28" y1="331.72" x2="98.38" y2="341.62" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.58"/>
          <line x1="139.00" y1="360.30" x2="135.50" y2="366.36" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="178.07" y1="376.48" x2="176.26" y2="383.24" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="220.00" y1="368.00" x2="220.00" y2="394.00" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.80"/>
          <line x1="261.93" y1="376.48" x2="263.74" y2="383.24" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="301.00" y1="360.30" x2="304.50" y2="366.36" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="331.72" y1="331.72" x2="341.62" y2="341.62" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.58"/>
          <line x1="360.30" y1="301.00" x2="366.36" y2="304.50" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <line x1="376.48" y1="261.93" x2="383.24" y2="263.74" stroke="currentColor" stroke-width="0.9" stroke-opacity="0.34"/>
          <text x="414.00" y="224.50" text-anchor="middle" class="math-label-major">0</text>
          <text x="357.18" y="86.32" text-anchor="middle" class="math-label-minor">&pi;/4</text>
          <text x="220.00" y="32.50" text-anchor="middle" class="math-label-major">&pi;/2</text>
          <text x="80.70" y="84.20" text-anchor="middle" class="math-label-minor">3&pi;/4</text>
          <text x="26.00" y="224.50" text-anchor="middle" class="math-label-major">&pi;</text>
          <text x="80.70" y="362.80" text-anchor="middle" class="math-label-minor">5&pi;/4</text>
          <text x="220.00" y="419.50" text-anchor="middle" class="math-label-major">3&pi;/2</text>
          <text x="359.30" y="362.80" text-anchor="middle" class="math-label-minor">7&pi;/4</text>
        </g>

        <!-- Inner dashed polar grid & phase arcs -->
        <g>
          <circle cx="220" cy="220" r="148" fill="none" stroke="currentColor" stroke-width="1.05" stroke-dasharray="3.5 5.5" stroke-opacity="0.42"/>
          <path d="M 364.77 189.23 A 148.00 148.00 0 0 0 275.44 82.78" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.72"/>
          <path d="M 75.23 250.77 A 148.00 148.00 0 0 0 164.56 357.22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.72"/>
          <!-- Unit-circle phase marker at pi/4 -->
          <line x1="313.34" y1="126.66" x2="337.38" y2="102.62" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.55"/>
          <circle cx="337.38" cy="102.62" r="6.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.42"/>
          <circle cx="337.38" cy="102.62" r="3.1" fill="currentColor" fill-opacity="0.88"/>
        </g>

        <!-- Inner concentric polar ring with 4 orthogonal harmonic nodes -->
        <g>
          <circle cx="220" cy="220" r="132" fill="none" stroke="currentColor" stroke-width="0.95" stroke-opacity="0.25"/>
          <circle cx="352.00" cy="220.00" r="2.6" fill="currentColor" fill-opacity="0.65"/>
          <circle cx="220.00" cy="88.00" r="2.6" fill="currentColor" fill-opacity="0.65"/>
          <circle cx="88.00" cy="220.00" r="2.6" fill="currentColor" fill-opacity="0.65"/>
          <circle cx="220.00" cy="352.00" r="2.6" fill="currentColor" fill-opacity="0.65"/>
        </g>
      </svg>

      <div class="logo-tilt" id="logoTilt">
        <a href="https://github.com/archsys-solvers" class="logo-link" title="archsys-solvers on GitHub">
          <img src="logo.svg" alt="archsys-solvers logo" class="logo" width="240" height="240">
        </a>
      </div>
      <div class="logo-shadow" aria-hidden="true"></div>
    </div>

    <h1>archsys-solvers</h1>
    <p class="tagline">High-Performance Architecture-Aware Numerical Solvers in C++17</p>

    <div class="status-badge">
      <span class="status-dot" aria-hidden="true"></span>
      Building...
    </div>

    <a href="https://github.com/archsys-solvers" class="github-link">github.com/archsys-solvers</a>
  </main>

  <script>
    (function () {
      const stage = document.getElementById('logoStage');
      const tilt = document.getElementById('logoTilt');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let rafId = null;

      stage.addEventListener('pointermove', function (e) {
        if (reducedMotion.matches || e.pointerType !== 'mouse') return;
        const rect = stage.getBoundingClientRect();
        const nx = (e.clientX - rect.left) / rect.width - 0.5;
        const ny = (e.clientY - rect.top) / rect.height - 0.5;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(function () {
          tilt.style.setProperty('--rx', (-ny * 14).toFixed(2) + 'deg');
          tilt.style.setProperty('--ry', (nx * 14).toFixed(2) + 'deg');
        });
      });

      stage.addEventListener('pointerleave', function () {
        if (rafId) cancelAnimationFrame(rafId);
        tilt.style.setProperty('--rx', '0deg');
        tilt.style.setProperty('--ry', '0deg');
      });
    })();
  </script>
</body>
</html>
