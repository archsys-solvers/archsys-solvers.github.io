<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>archsys-solvers</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    :root {
      --bg: #ffffff;
      --text: #0a0a0a;
      --muted: #737373;
      --border: #e5e5e5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --text: #ededed;
        --muted: #a1a1a1;
        --border: #262626;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      max-width: 480px;
      width: 100%;
    }

    .logo-link {
      display: inline-block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .logo-link:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }

    .logo {
      width: 120px;
      height: 120px;
      display: block;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .tagline {
      font-size: 0.98rem;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.5;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
    }

    .github-link {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .github-link:hover {
      color: var(--text);
      border-color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="https://github.com/archsys-solvers" class="logo-link" title="archsys-solvers on GitHub">
      <img src="logo.svg" alt="archsys-solvers logo" class="logo">
    </a>

    <h1>archsys-solvers</h1>
    <p class="tagline">High-Performance Architecture-Aware Numerical Solvers in C++17</p>

    <div class="status-badge">
      <span class="status-dot"></span>
      Building...
    </div>

    <a href="https://github.com/archsys-solvers" class="github-link">github.com/archsys-solvers</a>
  </div>
</body>
</html>
