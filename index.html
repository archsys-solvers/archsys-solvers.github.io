<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>archsys-solvers</title>
  <meta name="description" content="High-Performance Architecture-Aware Numerical Solvers in C++17">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    :root {
      --bg-light: #ffffff;
      --bg-dark: #0a0a0a;
      --text-light: #0a0a0a;
      --text-dark: #ededed;
      --muted-light: #6b7280;
      --muted-dark: #9ca3af;
      --border-light: #e5e7eb;
      --border-dark: #262626;
      --ring-light: rgba(10, 10, 10, 0.12);
      --ring-dark: rgba(255, 255, 255, 0.14);
      --shadow-light: rgba(10, 10, 10, 0.14);
      --shadow-dark: rgba(0, 0, 0, 0.55);

      --bg: var(--bg-light);
      --text: var(--text-light);
      --muted: var(--muted-light);
      --border: var(--border-light);
      --ring: var(--ring-light);
      --shadow: var(--shadow-light);

      /* Physics-based spring easing curve via CSS linear() */
      --spring-easing: linear(
        0, 0.009, 0.035 2.1%, 0.141, 0.281 6.7%, 0.723 12.9%, 0.938 16.7%,
        1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%,
        1.129 32.8%, 1.051 39.6%, 1.017 43.1%, 0.991, 0.977 51%, 0.974 53.8%,
        0.975 57.1%, 0.997 69.8%, 1.003 76.9%, 1.004 83.8%, 1
      );

      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --text: var(--text-dark);
        --muted: var(--muted-dark);
        --border: var(--border-dark);
        --ring: var(--ring-dark);
        --shadow: var(--shadow-dark);
      }
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --text: light-dark(var(--text-light), var(--text-dark));
        --muted: light-dark(var(--muted-light), var(--muted-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --ring: light-dark(var(--ring-light), var(--ring-dark));
        --shadow: light-dark(var(--shadow-light), var(--shadow-dark));
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      max-width: 520px;
      width: 100%;
    }

    /* Logo Stage: large, prominent, with subtle architectural orbit */
    .logo-stage {
      position: relative;
      width: clamp(240px, 42vw, 310px);
      height: clamp(240px, 42vw, 310px);
      display: grid;
      place-items: center;
      perspective: 900px;
      margin-bottom: 0.25rem;
    }

    .orbit-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px dashed var(--ring);
      pointer-events: none;
    }

    .orbit-ring::before {
      content: "";
      position: absolute;
      top: -3.5px;
      left: 50%;
      width: 6px;
      height: 6px;
      translate: -50% 0;
      border-radius: 50%;
      background-color: var(--muted);
      opacity: 0.55;
    }

    .orbit-ring-inner {
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      border: 1px solid var(--ring);
      opacity: 0.5;
      pointer-events: none;
    }

    .logo-tilt {
      --rx: 0deg;
      --ry: 0deg;
      display: grid;
      place-items: center;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
    }

    .logo-link {
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      outline-offset: 8px;
    }

    .logo-float {
      display: block;
    }

    .logo {
      width: clamp(190px, 33vw, 248px);
      height: clamp(190px, 33vw, 248px);
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .logo-shadow {
      position: absolute;
      bottom: -2px;
      width: 44%;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(closest-side, var(--shadow), transparent 72%);
      pointer-events: none;
      opacity: 0.7;
    }

    h1 {
      font-size: clamp(1.9rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .tagline {
      font-size: 1rem;
      color: var(--muted);
      font-weight: 400;
      line-height: 1.55;
      max-width: 42ch;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.4rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.86rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .status-dot {
      position: relative;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
    }

    .status-dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-color: #10b981;
      opacity: 0;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-top: 0.6rem;
    }

    .github-link {
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .github-link:hover,
    .github-link:focus-visible {
      color: var(--text);
      border-color: var(--text);
    }

    .motion-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.25rem 0.7rem;
      font: inherit;
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .motion-toggle:hover,
    .motion-toggle:focus-visible {
      color: var(--text);
      border-color: var(--text);
    }

    /* Keyframes: compositor-only transform and opacity */
    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes orbit-counter {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }

    @keyframes float-levitate {
      0%, 100% { transform: translateY(-7px); }
      50%      { transform: translateY(7px); }
    }

    @keyframes shadow-breathe {
      0%, 100% { transform: scale(0.88); opacity: 0.48; }
      50%      { transform: scale(1.06); opacity: 0.78; }
    }

    @keyframes dot-ping {
      0%   { transform: scale(1); opacity: 0.65; }
      75%  { transform: scale(2.4); opacity: 0; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    @keyframes fade-rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Opt in to motion only when user has no reduced-motion preference */
    @media (prefers-reduced-motion: no-preference) {
      .motion-toggle {
        display: inline-flex;
        align-items: center;
      }

      .logo-tilt {
        transition: transform 0.25s ease-out;
        will-change: transform;
      }

      .logo-link {
        transition: scale 0.65s ease-out;
        transition-timing-function: var(--spring-easing);
      }

      .logo-link:hover,
      .logo-link:focus-visible {
        scale: 1.07;
      }

      .logo-link:active {
        scale: 0.97;
      }

      .logo-float {
        animation: float-levitate 5.2s ease-in-out infinite;
      }

      .logo {
        animation: orbit-spin 28s linear infinite;
      }

      .orbit-ring {
        animation: orbit-counter 38s linear infinite;
      }

      .logo-shadow {
        animation: shadow-breathe 5.2s ease-in-out infinite;
      }

      .status-dot::after {
        animation: dot-ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .reveal {
        animation: fade-rise 0.65s ease-out both;
      }

      .reveal-1 { animation-delay: 0.05s; }
      .reveal-2 { animation-delay: 0.14s; }
      .reveal-3 { animation-delay: 0.22s; }
      .reveal-4 { animation-delay: 0.30s; }
    }

    /* Pause state controlled by the accessible motion toggle */
    body.motion-paused .logo-float,
    body.motion-paused .logo,
    body.motion-paused .orbit-ring,
    body.motion-paused .logo-shadow,
    body.motion-paused .status-dot::after {
      animation-play-state: paused;
    }

    body.motion-paused .logo-tilt {
      transform: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo-stage reveal reveal-1" id="logoStage">
      <div class="orbit-ring" aria-hidden="true"></div>
      <div class="orbit-ring-inner" aria-hidden="true"></div>
      <div class="logo-tilt" id="logoTilt">
        <a href="https://github.com/archsys-solvers" class="logo-link" title="archsys-solvers on GitHub">
          <span class="logo-float">
            <img src="logo.svg" alt="archsys-solvers logo" class="logo" width="248" height="248">
          </span>
        </a>
      </div>
      <div class="logo-shadow" aria-hidden="true"></div>
    </div>

    <h1 class="reveal reveal-2">archsys-solvers</h1>
    <p class="tagline reveal reveal-3">High-Performance Architecture-Aware Numerical Solvers in C++17</p>

    <div class="status-badge reveal reveal-4">
      <span class="status-dot" aria-hidden="true"></span>
      Building...
    </div>

    <div class="footer-links reveal reveal-4">
      <a href="https://github.com/archsys-solvers" class="github-link">github.com/archsys-solvers</a>
      <button type="button" class="motion-toggle" id="motionToggle">Pause animation</button>
    </div>
  </main>

  <script>
    (function () {
      const stage = document.getElementById('logoStage');
      const tilt = document.getElementById('logoTilt');
      const toggle = document.getElementById('motionToggle');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = false;
      let rafId = null;

      toggle.addEventListener('click', function () {
        paused = !paused;
        document.body.classList.toggle('motion-paused', paused);
        toggle.textContent = paused ? 'Play animation' : 'Pause animation';
        if (paused) {
          tilt.style.setProperty('--rx', '0deg');
          tilt.style.setProperty('--ry', '0deg');
        }
      });

      stage.addEventListener('pointermove', function (e) {
        if (paused || reducedMotion.matches || e.pointerType !== 'mouse') return;
        const rect = stage.getBoundingClientRect();
        const nx = (e.clientX - rect.left) / rect.width - 0.5;
        const ny = (e.clientY - rect.top) / rect.height - 0.5;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(function () {
          tilt.style.setProperty('--rx', (-ny * 16).toFixed(2) + 'deg');
          tilt.style.setProperty('--ry', (nx * 16).toFixed(2) + 'deg');
        });
      });

      stage.addEventListener('pointerleave', function () {
        if (rafId) cancelAnimationFrame(rafId);
        tilt.style.setProperty('--rx', '0deg');
        tilt.style.setProperty('--ry', '0deg');
      });
    })();
  </script>
</body>
</html>
