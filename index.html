<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>archsys-solvers | High-Performance Numerical Solvers</title>
  <meta name="description" content="High-Performance Architecture-Aware Numerical Solvers in C++17">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #9333ea;
      --primary-hover: #a855f7;
      --accent: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
      line-height: 1.6;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .logo-wrapper {
      margin-bottom: 1.75rem;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .logo-wrapper:hover {
      transform: scale(1.04);
    }

    .logo {
      width: 130px;
      height: 130px;
      display: block;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .tagline {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      font-weight: 400;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      background: rgba(147, 51, 234, 0.15);
      border: 1px solid rgba(147, 51, 234, 0.35);
      color: #c084fc;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #c084fc;
      border-radius: 50%;
      box-shadow: 0 0 8px #c084fc;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.35rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: 1px solid transparent;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    footer {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 1rem;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="https://github.com/archsys-solvers" class="logo-wrapper" title="archsys-solvers">
      <img src="logo.svg" alt="archsys-solvers logo" class="logo">
    </a>

    <h1>archsys-solvers</h1>
    <p class="tagline">High-Performance Architecture-Aware Numerical Solvers in C++17</p>

    <div class="status-pill">
      <span class="status-dot"></span>
      Portal in Active Development
    </div>

    <div class="actions">
      <a href="https://archsys-solvers.github.io/data-oriented-solver/" class="btn btn-primary">
        Solvers Documentation
      </a>
      <a href="https://github.com/archsys-solvers" class="btn btn-secondary">
        GitHub Organization
      </a>
      <a href="mailto:ahmed.ezzouine@um5r.ac.ma?subject=Inquiry%20regarding%20archsys-solvers" class="btn btn-secondary">
        Contact / Join
      </a>
    </div>

    <footer>
      &copy; 2026 archsys-solvers. Open source under the MIT License.
    </footer>
  </div>
</body>
</html>
